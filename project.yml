name: SCYDE
options:
  bundleIdPrefix: dev.scyde
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
  developmentLanguage: en
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
packages:
  SCYDECore:
    path: Core
targets:
  SCYDE:
    type: application
    platform: iOS
    sources:
      - path: App
    dependencies:
      - package: SCYDECore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.scyde.editor
        PRODUCT_NAME: SCYDE
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ENABLE_PREVIEWS: YES
    info:
      path: Config/Info.plist
      properties:
        CFBundleDisplayName: SCYDE
        CFBundleName: SCYDE
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIApplicationSupportsIndirectInputEvents: true
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        ITSAppUsesNonExemptEncryption: false
        NSPhotoLibraryUsageDescription: SCYDE reads the photos and videos you choose so you can edit them. Nothing is uploaded.
        NSPhotoLibraryAddUsageDescription: SCYDE saves your finished edits to your photo library.
        NSMicrophoneUsageDescription: SCYDE uses the microphone to record voice-overs.
        NSSpeechRecognitionUsageDescription: SCYDE uses on-device speech recognition to create captions.
        UIAppFonts:
          - Sora-Regular.ttf
          - Sora-SemiBold.ttf
          - Sora-Bold.ttf
          - Geist-Regular.ttf
          - Geist-Medium.ttf
          - Geist-SemiBold.ttf
          - GeistMono-Regular.ttf
          - GeistMono-Medium.ttf
          - Doto-Bold.ttf
